name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.so }}

    # bash nos tres sistemas: no Windows o shell padrao e o PowerShell, e ele
    # desmonta "-Dexec.args=..." em dois argumentos antes de o Maven ver.
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        so: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Testes
        run: mvn -B -ntp verify

      - name: O menor maximo para n elementos
        run: mvn -B -ntp -q exec:java -Dexec.args="minimos"

      - name: A sequencia de Conway e Guy conferida
        run: mvn -B -ntp -q exec:java -Dexec.args="conway-guy"

      - name: Quantos conjuntos otimos
        run: mvn -B -ntp -q exec:java -Dexec.args="otimos"

      - name: A tabela cruzada das duas podas
        run: mvn -B -ntp -q exec:java -Dexec.args="poda"

      - name: A busca contra a forca bruta
        run: mvn -B -ntp -q exec:java -Dexec.args="juiz"

      - name: Relatorios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.so }}
          path: target/surefire-reports

  pesado:
    # m(8) = 84 e os tres otimos de oito elementos: uns quatro minutos, uma vez so.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: O caso de oito elementos
        run: mvn -B -ntp test -Dexcluir=nenhum -Dgroups=pesado
